name: Update weekly medians
on:
  schedule:
    - cron: '23 13 * * 3' # Wednesday, 7:23am Mountain daylight / 6:23am standard time
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-medians
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check publisher configuration
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_MEDIANS_DEPLOY_HOOK }}
        run: test -n "$DEPLOY_HOOK" || { echo 'Missing VERCEL_MEDIANS_DEPLOY_HOOK repository secret.'; exit 1; }
      - name: Check scoring and update safety
        run: node --test tests/scoring-median.test.cjs
      - name: Build completed weekly points
        run: node scripts/build_weekly_points_sleeper.mjs
      - name: Commit changed weekly files
        id: commit
        run: |
          git add data/weekly_points_current.json data/weekly_points_[0-9][0-9][0-9][0-9].json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update completed weekly median data'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Publish refreshed data with Vercel
        # Always request a deployment: a rerun can recover a previously failed hook.
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_MEDIANS_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --retry 2 --request POST "$DEPLOY_HOOK" --output /dev/null
